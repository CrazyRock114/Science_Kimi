# GitHub Pages 部署（海外访问入口）
# 国内访问走对象存储/CDN 部署（见 docs/research-and-plan.md 部署节）
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test
      # Pages 站点位于 /Science_Kimi/ 子路径，需设置 base
      - run: npm run build
        env:
          VITE_BASE: /Science_Kimi/
      # SPA 路由回退：GitHub Pages 对所有 404 返回 404.html
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
